<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" type="image/svg+xml" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/svg+xml" sizes="16x16" href="/favicon-16x16.svg" />
    <link rel="icon" type="image/svg+xml" sizes="32x32" href="/favicon-32x32.svg" />
    <link rel="icon" type="image/svg+xml" sizes="48x48" href="/favicon-48x48.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>BSTC Practice | Language Hindi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../styles.css" />
  </head>
  <body class="bg-white text-slate-800">
    <header class="top-nav sticky top-0 z-50">
      <nav class="nav-shell" aria-label="Main navigation">
        <a href="../../index.html" class="brand-logo" aria-label="ToolShala home"><span class="brand-mark">ToolShala</span><span class="brand-dot" aria-hidden="true"></span></a>
        <div class="hidden items-center gap-2 md:flex"><a class="nav-link" href="../../index.html">Home</a><a class="nav-link nav-active" href="../../mock-test.html">Mock Test</a><a class="nav-link" href="../../about.html">About</a><a class="nav-link" href="../../contact.html">Contact</a></div>
      </nav>
    </header>

    <main id="main-content" class="pb-16">
      <section class="page-hero border-b border-slate-200">
        <div class="mx-auto max-w-5xl px-4 py-10 sm:px-6 lg:px-8">
          <p class="mb-3 text-sm font-semibold uppercase tracking-[0.18em] text-indigo-700">BSTC Subject Practice</p>
          <h1 class="text-3xl font-extrabold tracking-tight md:text-4xl">Language Hindi Practice</h1>
          <p class="mt-3 max-w-3xl text-slate-600">Ek question par focus karke Hindi language practice karein, answer check karein, aur turant explanation dekhein.</p>
        </div>
      </section>

      <section class="mx-auto mt-8 max-w-5xl px-4 sm:px-6 lg:px-8">
        <div id="practice-card" class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-7">
          <div class="mb-4 flex items-center justify-between gap-4">
            <p id="progress" class="text-sm font-semibold text-slate-600"></p>
            <a href="./bstc-practice-sets.html" class="btn-secondary">Back to Practice Hub</a>
          </div>

          <h2 id="question" class="text-xl font-bold leading-snug text-slate-900"></h2>

          <form id="options-form" class="mt-5 space-y-3" aria-label="Question options"></form>

          <div class="mt-6 flex flex-wrap gap-3">
            <button id="check-btn" class="btn-primary" type="button">Check Answer</button>
            <button id="prev-btn" class="btn-secondary" type="button">Previous</button>
            <button id="next-btn" class="btn-secondary" type="button">Next</button>
          </div>

          <div id="feedback" class="mt-6 hidden rounded-xl border p-4"></div>
          <div id="explanation" class="mt-4 hidden rounded-xl border border-indigo-200 bg-indigo-50 p-4">
            <h3 class="text-sm font-bold uppercase tracking-wide text-indigo-800">Explanation</h3>
            <p id="explanation-text" class="mt-1 text-sm leading-relaxed text-indigo-900"></p>
          </div>
        </div>
      </section>
    </main>

    <script src="../../script.js"></script>
    <script src="./bstc-practice-language-hindi.js"></script>
  </body>
</html>
